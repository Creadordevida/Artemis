name: artemis
description: Artemis - ayuda y orientación para adolescentes, Navarra.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  torch_light: ^2.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline/navarra_frontline.json
    - assets/offline/manifest.json
