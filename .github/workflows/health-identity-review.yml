name: Review official public health identities (no APK)
on:
  push:
    branches: [feat/mapa-online-recursos]
    paths:
      - 'tools/audit_health_identity.py'
      - '.github/workflows/health-identity-review.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyshp==2.3.1 pyproj==3.7.2
      - name: Match public health identities using official unique codes
        run: python tools/audit_health_identity.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-health-identity-audit
          path: build/public-health-match-report/
          if-no-files-found: error
          retention-days: 14
