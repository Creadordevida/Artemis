name: Build Navarra cadastral street pack (no APK)
on:
  push:
    branches: [feat/mapa-online-recursos]
    paths:
      - 'tools/build_cadastral_navarra.py'
      - '.github/workflows/cadastre-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry decoders
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1 pyproj==3.7.2 shapely==2.1.2
      - name: Build official Navarra cadastral street and name layers
        run: python tools/build_cadastral_navarra.py
      - name: Publish audit artifact (not APK)
        uses: actions/upload-artifact@v4
        with:
          name: navarra-cadastral-streets-review
          path: build/cadastral-streets/
          if-no-files-found: error
          retention-days: 14
      - name: Store verified cadastral pack on feature branch
        if: github.ref == 'refs/heads/feat/mapa-online-recursos'
        run: |
          git fetch origin feat/mapa-online-recursos
          git checkout -B feat/mapa-online-recursos origin/feat/mapa-online-recursos
          mkdir -p assets/offline
          cp build/cadastral-streets/navarra_cadastral_streets.json assets/offline/navarra_cadastral_streets.json
          cp build/cadastral-streets/navarra_cadastral_manifest.json assets/offline/navarra_cadastral_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/offline/navarra_cadastral_streets.json assets/offline/navarra_cadastral_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: add official Navarra cadastral street atlas [skip ci]"
            git pull --rebase origin feat/mapa-online-recursos
            git push origin HEAD:feat/mapa-online-recursos
          fi
