name: Build official Navarra resource pack
on:
  push:
    branches: [feat/datos-oficiales-navarra]
    paths:
      - 'tools/build_offline_navarra.py'
      - '.github/workflows/official-data.yml'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1 pyproj==3.7.2
      - name: Validate importer syntax
        run: python -m py_compile tools/build_offline_navarra.py
      - name: Download and validate official datasets
        run: python tools/build_offline_navarra.py --output build/offline-data
      - name: Upload review pack (NOT app data yet)
        uses: actions/upload-artifact@v4
        with:
          name: navarra-official-sources-review
          path: build/offline-data/
          if-no-files-found: error
          retention-days: 14
      - name: Commit reviewed-type shortlist to feature branch only
        if: github.ref == 'refs/heads/feat/datos-oficiales-navarra'
        run: |
          mkdir -p assets/offline
          cp build/offline-data/navarra_frontline.json assets/offline/navarra_frontline.json
          cp build/offline-data/manifest.json assets/offline/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/offline/navarra_frontline.json assets/offline/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: snapshot official Navarra shortlist [skip ci]"
            git push origin HEAD:feat/datos-oficiales-navarra
          fi
