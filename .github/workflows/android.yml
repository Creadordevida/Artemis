name: Android validation (development)
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android project
        run: |
          flutter create --platforms=android --project-name=artemis --org=org.artemis.help .
          # flutter create generates a counter demo test referring to MyApp;
          # our own test/smoke_test.dart is the actual app test.
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        # Flutter 3.50 currently emits informational material.dart
        # deprecation messages; infos should not block a prototype build.
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build debug APK (non-operational prototype)
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-prototype
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  official-data-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geodata parser
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1 pyproj==3.7.2
      - name: Audit public ownership metadata
        run: python tools/audit_public_health.py
      - name: Fetch and validate official data
        run: python tools/build_offline_navarra.py --output build/offline-data
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: navarra-official-review
          path: build/offline-data/
          if-no-files-found: error
          retention-days: 14
      - name: Snapshot public-only dataset on internal feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/datos-oficiales-navarra'
        run: |
          git fetch origin feat/datos-oficiales-navarra
          git checkout -B feat/datos-oficiales-navarra origin/feat/datos-oficiales-navarra
          mkdir -p assets/offline
          cp build/offline-data/navarra_frontline.json assets/offline/navarra_frontline.json
          cp build/offline-data/manifest.json assets/offline/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/offline/navarra_frontline.json assets/offline/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: include audited public-only Navarra facilities [skip ci]"
            git push origin HEAD:feat/datos-oficiales-navarra
          fi

  map-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tile metadata parser
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile==2.2.0
      - name: Download Navarra Shortbread vector map
        run: |
          mkdir -p build
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 https://download-ext2.geofabrik.de/europe/spain/navarra-shortbread-1.0.mbtiles --output build/navarra.mbtiles
      - name: Verify archive and layer schema
        run: python tools/inspect_navarra_tiles.py build/navarra.mbtiles
      - name: Store verification report only
        uses: actions/upload-artifact@v4
        with:
          name: navarra-offline-map-probe
          path: build/navarra_mbtiles_probe.json
          if-no-files-found: error
          retention-days: 14
