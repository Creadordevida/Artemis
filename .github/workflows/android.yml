name: Android validation (development)
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold if missing
        run: |
          flutter create --platforms=android --project-name=artemis --org=org.artemis.help .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK (unverified prototype)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-prototype
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
