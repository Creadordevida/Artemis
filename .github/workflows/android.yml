name: Android validation (development)
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Android project
        run: |
          flutter create --platforms=android --project-name=artemis --org=org.artemis.help .
          # flutter create generates a counter demo test referring to MyApp;
          # our own test/smoke_test.dart is the actual app test.
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        # Flutter 3.50 currently emits informational material.dart
        # deprecation messages; infos should not block a prototype build.
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build debug APK (non-operational prototype)
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-prototype
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

