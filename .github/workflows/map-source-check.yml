name: Validate online map source (no APK)
on:
  push:
    branches: [feat/mapa-online-recursos]
  pull_request:
    branches: [feat/datos-oficiales-navarra]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project metadata without building APK
        run: |
          flutter create --platforms=android --project-name=artemis --org=org.artemis.help .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Confirm no APK generation
        run: test ! -e build/app/outputs/flutter-apk/app-debug.apk

  verify-street-wfs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded official street and path WFS probe
        run: python tools/probe_idena_wfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: idena-wfs-streets-investigation
          path: build/wfs-probe/idena_wfs_capabilities_audit.json
          if-no-files-found: error
          retention-days: 7

  prepare-street-path-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry converters
        run: python -m pip install --disable-pip-version-check shapely==2.1.2 pyproj==3.7.2
      - name: Unit tests for safe paginated WFS ingestion
        run: python tools/test_idena_wfs_importer.py
      - name: Pilot 500 features per layer from IDENA official WFS
        run: python tools/build_idena_streets_paths.py --limit 500 --out build/street-paths
      - uses: actions/upload-artifact@v4
        with:
          name: navarra-urban-street-pilot
          path: build/street-paths/
          if-no-files-found: error
          retention-days: 7

