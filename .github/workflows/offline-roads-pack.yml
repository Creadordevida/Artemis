name: Build official Navarra offline roads (no APK)
on:
  push:
    branches: [feat/mapa-online-recursos]
    paths:
      - 'tools/build_offline_roads.py'
      - '.github/workflows/offline-roads-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data conversion libraries
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1 pyproj==3.7.2 shapely==2.1.2
      - name: Build local Navarra road lines
        run: python tools/build_offline_roads.py
      - name: Store source provenance
        uses: actions/upload-artifact@v4
        with:
          name: navarra-offline-road-vectors
          path: build/offline-roads/
          if-no-files-found: error
          retention-days: 14
      - name: Commit inspected road overview, no APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/mapa-online-recursos'
        run: |
          git fetch origin feat/mapa-online-recursos
          git checkout -B feat/mapa-online-recursos origin/feat/mapa-online-recursos
          mkdir -p assets/offline
          cp build/offline-roads/navarra_road_lines.json assets/offline/navarra_road_lines.json
          cp build/offline-roads/navarra_road_manifest.json assets/offline/navarra_road_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/offline/navarra_road_lines.json assets/offline/navarra_road_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: store audited Navarra offline road-axis overview [skip ci]"
            git pull --rebase origin feat/mapa-online-recursos
            git push origin HEAD:feat/mapa-online-recursos
          fi
